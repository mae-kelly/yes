[package]
name = "arb-scanner"
version = "0.2.0"
edition = "2021"

[dependencies]
ethers = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6.1"
parking_lot = "0.12"
chrono = "0.4"
futures = "0.3"
hex = "0.4"
revm = "3.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false

[profile.release-with-debug]
inherits = "release"
debug = true