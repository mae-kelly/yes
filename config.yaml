max_workers: 32
batch_size: 1000
max_tables_per_dataset: 200

max_cost_per_query: 2.0
max_total_cost: 200.0
skip_large_tables: true
max_table_size_gb: 50

cache_dir: ".cache"
cache_ttl_hours: 48
enable_memory_cache: true

database_path: "universal_cmdb.db"
enable_checkpointing: true
checkpoint_interval_minutes: 5

confidence_threshold: 0.3
sample_validation_threshold: 0.4
prioritize_core_datasets: true

skip_patterns:
  datasets:
    - "temp"
    - "test"
    - "staging"
    - "backup"
    - "archive"
    - "logs"
    - "audit"
  tables:
    - "temp_"
    - "test_"
    - "staging_"
    - "backup_"
    - "archive_"
    - "log_"
    - "audit_"
    - "_temp"
    - "_test"

dataset_priorities:
  SAS_BI: 100
  CMDB: 95
  CSIRT: 90
  SECURITY: 85
  AXONIUS: 85
  CROWDSTRIKE: 80
  SPLUNK: 80
  MONITORING: 75
  COMPLIANCE: 70
  NETWORK: 65

parallel_dataset_processing: true
parallel_table_processing: true
graceful_failure_handling: true

content_analysis:
  max_sample_size: 15
  validation_patterns:
    hostname:
      - "^[a-zA-Z0-9][a-zA-Z0-9\\-]*[a-zA-Z0-9]$"
      - "^[a-zA-Z0-9][a-zA-Z0-9\\-\\.]*[a-zA-Z0-9]$"
    ip:
      - "^(\\d{1,3}\\.){3}\\d{1,3}$"
    domain:
      - "^[a-zA-Z0-9][a-zA-Z0-9\\-\\.]*\\.[a-zA-Z]{2,}$"

bigquery_settings:
  query_timeout_seconds: 300
  max_results_per_page: 10000
  use_query_cache: true
  dry_run_first: false

logging:
  level: "INFO"
  file_rotation: true
  max_file_size_mb: 100
  backup_count: 5

output:
  generate_reports: true
  create_visualizations: false
  export_formats: ["sql", "json"]
  compress_results: false

recovery:
  auto_resume: true
  checkpoint_compression: true
  max_checkpoint_age_hours: 24

resource_limits:
  max_memory_usage_gb: 8
  max_disk_cache_gb: 10
  connection_pool_size: 20

advanced:
  enable_ml_classification: false
  enable_graph_analysis: false
  enable_anomaly_detection: false
  ml_confidence_threshold: 0.7

debug:
  enable_debug_mode: false
  save_intermediate_results: false
  profile_performance: false
  verbose_error_reporting: true