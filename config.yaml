max_workers: 12
cache_dir: ".cache"
cache_ttl_hours: 24
enable_memory_cache: true

database_path: "ao1_visibility_cmdb.db"
enable_checkpointing: true
checkpoint_interval_minutes: 2

confidence_threshold: 0.2
sample_validation_threshold: 0.3
prioritize_core_datasets: true

skip_patterns:
  datasets: []
  tables: []

dataset_priorities:
  SAS_BI: 100
  CMDB: 95
  CSIRT: 90
  SECURITY: 85
  AXONIUS: 85
  CROWDSTRIKE: 80
  SPLUNK: 80
  MONITORING: 75
  COMPLIANCE: 70
  NETWORK: 65

parallel_dataset_processing: true
parallel_table_processing: true
graceful_failure_handling: true

content_analysis:
  max_sample_size: 10

bigquery_settings:
  query_timeout_seconds: 300
  max_results_per_page: 10000
  use_query_cache: true
  dry_run_first: false

logging:
  level: "INFO"
  file_rotation: true
  max_file_size_mb: 100
  backup_count: 5

output:
  generate_reports: true
  create_visualizations: false
  export_formats: ["sql", "json"]
  compress_results: false

recovery:
  auto_resume: true
  checkpoint_compression: true
  max_checkpoint_age_hours: 24

resource_limits:
  max_memory_usage_gb: 8
  max_disk_cache_gb: 10
  connection_pool_size: 20

advanced:
  enable_ml_classification: false
  enable_graph_analysis: false
  enable_anomaly_detection: false
  ml_confidence_threshold: 0.5

debug:
  enable_debug_mode: false
  save_intermediate_results: false
  profile_performance: false
  verbose_error_reporting: true