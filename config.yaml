max_workers: 4
cache_dir: ".cache"
cache_ttl_hours: 24
enable_memory_cache: true

database_path: "ao1_visibility_cmdb.db"
enable_checkpointing: true
checkpoint_interval_minutes: 1

confidence_threshold: 0.2
sample_validation_threshold: 0.3
prioritize_core_datasets: true

skip_patterns:
  datasets: []
  tables: []

dataset_priorities:
  SAS_BI: 100
  datalake: 95
  CMDB: 90
  CSIRT: 85
  SECURITY: 80
  AXONIUS: 75
  CROWDSTRIKE: 70
  SPLUNK: 65
  MONITORING: 60
  COMPLIANCE: 55
  NETWORK: 50

parallel_dataset_processing: true
parallel_table_processing: true
graceful_failure_handling: true

content_analysis:
  max_sample_size: 10

bigquery_settings:
  query_timeout_seconds: 300
  max_results_per_page: 10000
  use_query_cache: false
  dry_run_first: false
  connection_pool_size: 2
  max_retries: 3
  retry_delay_seconds: 5

logging:
  level: "INFO"
  file_rotation: true
  max_file_size_mb: 100
  backup_count: 5

output:
  generate_reports: true
  create_visualizations: false
  export_formats: ["sql", "json"]
  compress_results: false

recovery:
  auto_resume: true
  checkpoint_compression: true
  max_checkpoint_age_hours: 24

resource_limits:
  max_memory_usage_gb: 6
  max_disk_cache_gb: 8
  connection_pool_size: 2

m1_optimizations:
  enable_metal_performance_shaders: true
  use_apple_silicon_acceleration: true
  optimize_memory_usage: true
  torch_backend: "mps"
  max_parallel_operations: 4

advanced:
  enable_ml_classification: false
  enable_graph_analysis: false
  enable_anomaly_detection: false
  ml_confidence_threshold: 0.5

debug:
  enable_debug_mode: false
  save_intermediate_results: false
  profile_performance: false
  verbose_error_reporting: true