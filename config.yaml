# Host Discovery Configuration
# This config focuses on finding ALL hosts across ALL BigQuery tables

# BigQuery Projects to scan (replace with your actual project IDs)
project_ids:
  - your-first-project-id
  - your-second-project-id

# Output directory for results
output_dir: host_discovery_output

# Discovery settings optimized for comprehensive scanning
discovery_settings:
  # Maximum number of rows to sample per table (increased for better coverage)
  max_sample_size: 100000
  
  # Percentage of table to sample (20% should catch most hosts)
  sample_ratio: 0.2
  
  # Minimum confidence for column classification
  min_confidence: 0.6
  
  # Batch size for processing
  batch_size: 10000
  
  # Number of parallel workers (adjust based on your system)
  max_workers: 16
  
  # Maximum tables to process per project (set to high number for complete scan)
  max_tables_per_project: 10000
  
  # Maximum rows per query
  max_rows_per_query: 100000

# Target columns we're looking for
# The system will automatically find variations of these column names
target_columns:
  host:
