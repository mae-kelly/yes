# Performance settings
performance:
  # Memory limit in GB
  memory_limit_gb: 8
  
  # CPU cores to use
  cpu_cores: 4
  
  # Enable parallel processing
  enable_parallel_processing: true
  
  # Enable caching for repeated queries
  cache_enabled: true

# Logging configuration  
logging:
  level: INFO
  enable_metrics: true
  enable_progress_bars: true

# Output formats to generate
output_formats:
  # Generate CSV export of all hosts
  csv_export: true
  
  # Generate Excel workbook with multiple sheets
  excel_export: true
  
  # Generate JSON results
  json_results: true
  
  # Generate markdown reports
  markdown_reports: true
  
  # Generate executive summary
  executive_summary: true

# Data quality settings
data_quality:
  # Minimum hostname length
  min_hostname_length: 2
  
  # Maximum hostname length  
  max_hostname_length: 253
  
  # Skip obviously invalid hostnames
  skip_invalid_hostnames: true
  
  # Merge strategy for conflicting data
  conflict_resolution: "most_sources"  # Options: "most_sources", "newest", "manual"

# Hostname validation rules
hostname_validation:
  # Invalid hostname patterns to skip
  skip_patterns:
    - "null"
    - "none" 
    - "unknown"
    - "n/a"
    - "test"
    - "localhost"
    - "127.0.0.1"
    - "undefined"
    - "sample"
  
  # Require at least one letter in hostname
  require_letter: true
  
  # Skip IP addresses as hostnames
  skip_ip_addresses: false

# Advanced settings
advanced:
  # Use machine learning for column classification
  use_ml_classification: true
  
  # Enable intelligent sampling (focus on tables with more host diversity)
  intelligent_sampling: true
  
  # Enable data deduplication across tables
  enable_deduplication: true
  
  # Timeout per table query (seconds)
  query_timeout: 300