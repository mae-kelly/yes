project_ids:
  - chronicle-fisv
  - fisv-security
  - fisv-logs
  - fisv-data
  - fisv-compliance
  - fisv-infrastructure
  - fisv-cloud
  - fisv-network

output_dir: visibility_output

discovery_settings:
  max_sample_size: 10000
  sample_ratio: 0.1
  min_confidence: 0.7
  batch_size: 5000
  max_workers: 32
  max_tables_per_project: 1000
  max_rows_per_query: 100000

coverage_thresholds:
  cmdb_target: 0.95
  edr_target: 0.90
  tanium_target: 0.85
  dlp_target: 0.80
  splunk_target: 0.95
  gso_target: 0.95
  chronicle_target: 0.85
  crowdstrike_target: 0.90

infrastructure_types:
  - on_premise
  - cloud
  - saas
  - api

regions:
  - na
  - latam
  - europe
  - apac

system_classifications:
  - web_server
  - windows_server
  - linux_server
  - nix
  - mainframe
  - database
  - network_appliance

business_units:
  - fig
  - bank_solutions
  - credit_union_solutions
  - wealth_management
  - investment_banking
  - retail_banking
  - commercial_banking
  - treasury
  - risk_management
  - compliance
  - payments
  - cards
  - lending
  - mortgage
  - capital_markets

log_role_mappings:
  network:
    log_types:
      - firewall_traffic
      - ids_ips
      - ndr
      - proxy
      - dns
      - waf
    visibility_factors:
      - url_fqdn_coverage
      - cmdb_visibility
      - network_zones
      - ipam_public_ip
      - geolocation
      - vpc
      
  endpoint:
    log_types:
      - os_logs
      - edr
      - dlp
      - fim
      - winEvt
      - linux_syslog
    visibility_factors:
      - cmdb_visibility
      - crowdstrike_coverage
      - log_ingest_volume
      
  cloud:
    log_types:
      - cloud_event
      - cloud_load_balancer
      - cloud_config
      - theom
      - wiz
      - cloud_security
    visibility_factors:
      - vpc
      - ipam_public_ip
      - url_fqdn_coverage
      - crowdstrike_coverage
      
  application:
    log_types:
      - web_logs
      - api_gateway
      - http_access
    visibility_factors:
      - url_fqdn_coverage
      - control_coverage
      - domain
      
  identity:
    log_types:
      - authentication_attempts
      - privilege_escalation
      - identity_operations
    visibility_factors:
      - domain
      - internal
      - external
      - controls

visibility_weights:
  cmdb_visibility: 0.25
  edr_coverage: 0.15
  tanium_coverage: 0.10
  dlp_coverage: 0.10
  splunk_logging: 0.15
  gso_logging: 0.10
  crowdstrike_coverage: 0.10
  chronicle_coverage: 0.05

risk_factors:
  no_edr: high
  no_logging: critical
  no_cmdb: medium
  low_visibility: high
  no_dlp: medium
  
compliance_requirements:
  logging_standard: GSO and Splunk
  endpoint_protection: EDR or Tanium
  data_protection: DLP Agent
  asset_management: CMDB
  
ml_settings:
  enable_neural_classification: true
  confidence_threshold: 0.7
  use_transformer_embeddings: true
  model_type: sentence-transformers/all-MiniLM-L6-v2
  
database_settings:
  type: duckdb
  path: ao1_visibility.duckdb
  enable_compression: true
  enable_indexes: true
  
reporting:
  generate_executive_report: true
  generate_csv_export: true
  generate_json_results: true
  generate_coverage_heatmap: true
  
performance:
  memory_limit_gb: 16
  cpu_cores: 8
  enable_parallel_processing: true
  cache_enabled: true
  
monitoring:
  log_level: INFO
  enable_metrics: true
  enable_tracing: false
  metrics_interval_seconds: 60