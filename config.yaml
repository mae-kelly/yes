# Intelligent AO1 Discovery Configuration
# Optimized for maximum intelligence and data quality

# Intelligence Settings
intelligence_level: "expert"
enable_deep_analysis: true
enable_semantic_matching: true
enable_predictive_enrichment: true
enable_quality_scoring: true

# Memory and Performance Optimization
max_memory_mb: 1024
max_disk_gb: 10
enable_intelligent_caching: true
cache_compression: true
cache_ttl_hours: 48
adaptive_batch_sizing: true

# Database Configuration
database_path: "ao1_intelligent_cmdb.db"
enable_advanced_indexing: true
enable_query_optimization: true
enable_data_deduplication: true

# Discovery Intelligence
hostname_normalization_aggressive: true
enable_hostname_variants: true
enable_fuzzy_matching: true
semantic_confidence_threshold: 0.5
validation_confidence_threshold: 0.6
data_quality_threshold: 0.7

# Content Analysis Intelligence
enable_pattern_recognition: true
enable_statistical_analysis: true
enable_anomaly_detection: true
sample_size_adaptive: true
min_sample_size: 5
max_sample_size: 50

# Data Fusion Intelligence
enable_multi_source_fusion: true
enable_conflict_resolution: true
enable_confidence_weighting: true
enable_temporal_analysis: true
data_freshness_weight: 0.3
source_reliability_weight: 0.4
validation_score_weight: 0.3

# Network Intelligence
enable_network_discovery: true
enable_ip_validation: true
enable_mac_discovery: true
enable_domain_extraction: true
enable_subnet_analysis: true

# Security Intelligence
enable_security_classification: true
enable_risk_scoring: true
enable_compliance_mapping: true
prioritize_security_sources: true

# Regional Intelligence
enable_geo_intelligence: true
enable_datacenter_mapping: true
enable_cloud_detection: true
enable_region_standardization: true

# Business Intelligence
enable_business_mapping: true
enable_cost_center_analysis: true
enable_owner_identification: true
enable_criticality_assessment: true

# Source Prioritization (Higher numbers = higher priority)
source_priorities:
  cmdb: 100
  crowdstrike: 95
  splunk: 90
  chronicle: 85
  security: 80
  monitoring: 75
  network: 70
  infrastructure: 65
  compliance: 60
  discovery: 50

# Table Intelligence Scoring
table_scoring:
  enable_richness_scoring: true
  enable_completeness_scoring: true
  enable_quality_scoring: true
  richness_weight: 0.4
  completeness_weight: 0.3
  quality_weight: 0.3

# Field Type Intelligence
field_type_priorities:
  hostname: 100
  fqdn: 95
  ip_address: 90
  mac_address: 85
  region: 80
  environment: 75
  operating_system: 70
  business_unit: 65
  infrastructure_type: 60
  application: 55

# Processing Intelligence
enable_parallel_processing: true
max_concurrent_tables: 5
max_concurrent_enrichments: 10
intelligent_backoff: true
adaptive_timeouts: true
graceful_degradation: true

# Checkpoint Intelligence
enable_intelligent_checkpointing: true
checkpoint_interval_minutes: 2
checkpoint_on_signal: true
checkpoint_compression: true
auto_recovery: true

# Cache Intelligence
intelligent_cache_eviction: true
promote_hot_data: true
compress_cold_data: true
cache_hit_optimization: true
memory_pressure_handling: true

# Query Intelligence
enable_query_optimization: true
enable_partition_detection: true
enable_sampling_optimization: true
enable_cost_estimation: true
max_query_cost_usd: 10.0

# Error Intelligence
intelligent_error_handling: true
enable_retry_strategies: true
enable_fallback_mechanisms: true
error_pattern_recognition: true
adaptive_error_recovery: true

# Logging Intelligence
log_level: "INFO"
enable_performance_logging: true
enable_quality_metrics: true
enable_intelligence_tracking: true
log_rotation: true
max_log_size_mb: 200

# Output Intelligence
generate_intelligent_reports: true
enable_visualization_data: true
enable_recommendation_engine: true
export_formats: ["json", "sql", "csv"]
compress_outputs: false

# Validation Intelligence
enable_data_validation: true
enable_format_validation: true
enable_semantic_validation: true
enable_business_rule_validation: true
validation_strictness: "moderate"

# Advanced Features
enable_machine_learning: false  # Requires additional dependencies
enable_graph_analysis: false    # Requires graph libraries
enable_time_series_analysis: false  # Requires time series libraries
enable_nlp_analysis: false      # Requires NLP libraries

# Debugging and Development
debug_mode: false
enable_profiling: false
save_intermediate_results: false
verbose_logging: false
enable_telemetry: true

# System Limits and Safety
max_tables_per_dataset: 100
max_rows_per_query: 100000
max_processing_time_hours: 4
memory_safety_margin: 0.2
disk_safety_margin: 0.1

# Intelligence Metadata
config_version: "2.0"
intelligence_framework: "claude_optimized"
optimization_target: "maximum_data_quality"
created_by: "intelligent_ao1_system"
last_updated: "2025-01-01"