<!-- ech/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUANTUM NEXUS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #000000;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }
    
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .neural-core {
      width: 200px;
      height: 200px;
      position: relative;
      margin-bottom: 3rem;
    }
    
    .core-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid;
      animation: coreRotation 4s linear infinite;
      filter: blur(0.5px);
    }
    
    .ring-outer {
      width: 200px;
      height: 200px;
      border-color: #00ffff;
      box-shadow: 0 0 40px #00ffff, inset 0 0 40px rgba(0, 255, 255, 0.3);
      animation-duration: 8s;
    }
    
    .ring-middle {
      width: 150px;
      height: 150px;
      top: 25px;
      left: 25px;
      border-color: #ff00ff;
      box-shadow: 0 0 30px #ff00ff, inset 0 0 30px rgba(255, 0, 255, 0.3);
      animation-duration: 6s;
      animation-direction: reverse;
    }
    
    .ring-inner {
      width: 100px;
      height: 100px;
      top: 50px;
      left: 50px;
      border-color: #ff69b4;
      box-shadow: 0 0 25px #ff69b4, inset 0 0 25px rgba(255, 105, 180, 0.3);
      animation-duration: 4s;
    }
    
    .core-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #00ffff 0%, #ff00ff 50%, transparent 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 30px #00ffff, 0 0 60px #ff00ff;
      animation: centerPulse 2s ease-in-out infinite;
      filter: blur(0.3px);
    }
    
    @keyframes coreRotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes centerPulse {
      0%, 100% { 
        transform: translate(-50%, -50%) scale(1); 
        box-shadow: 0 0 50px #00ffff, 0 0 100px #ff00ff;
      }
      50% { 
        transform: translate(-50%, -50%) scale(1.2); 
        box-shadow: 0 0 80px #00ffff, 0 0 150px #ff00ff;
      }
    }
    
    .loading-sequence {
      text-align: center;
      max-width: 500px;
    }
    
    .loading-text {
      color: #00ffff;
      font-size: 0.9rem;
      font-weight: 500;
      margin: 0.8rem 0;
      opacity: 0;
      transform: translateY(20px);
      animation: textSequence 0.8s ease-out forwards;
      letter-spacing: 0.2em;
      text-shadow: 0 0 20px currentColor;
    }
    
    .progress-bar {
      width: 400px;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 255, 255, 0.2);
      border-radius: 2px;
      margin: 2rem auto;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, 
        #00ffff 0%, 
        #ff00ff 50%, 
        #ff69b4 100%);
      width: 0%;
      animation: progressFill 4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      box-shadow: 0 0 20px currentColor;
      filter: brightness(1.5);
    }
    
    @keyframes textSequence {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes progressFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    
    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }
    
    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      animation: gridMove 10s linear infinite;
    }
    
    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="grid-overlay"></div>
    <div class="neural-core">
      <div class="core-ring ring-outer"></div>
      <div class="core-ring ring-middle"></div>
      <div class="core-ring ring-inner"></div>
      <div class="core-center">NEXUS</div>
    </div>
    
    <div class="loading-sequence">
      <div class="loading-text" style="animation-delay: 0.5s; color: #00ffff;">QUANTUM MATRIX ONLINE</div>
      <div class="loading-text" style="animation-delay: 1s; color: #ff00ff;">NEURAL PATHWAYS SYNCED</div>
      <div class="loading-text" style="animation-delay: 1.5s; color: #ff69b4;">DATA STREAMS ACTIVE</div>
      <div class="loading-text" style="animation-delay: 2s; color: #00ffff;">ALGORITHMS CALIBRATED</div>
      <div class="loading-text" style="animation-delay: 2.5s; color: #ff00ff;">PROTOCOLS ENGAGED</div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <div class="loading-text" style="animation-delay: 3.5s; color: #ff69b4; font-weight: 700; font-size: 1rem; text-shadow: 0 0 40px currentColor;">SYSTEM ACTIVATED</div>
    </div>
  </div>
  
  <div id="app"></div>
  
  <script>
    setTimeout(() => {
      document.getElementById('loading-screen').classList.add('hidden');
    }, 5000);
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
