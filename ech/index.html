<!-- ech/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/ao1-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AO1 Neural Intelligence - Holographic Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'JetBrains Mono', monospace;
      background: radial-gradient(ellipse at center, #1a0d2e 0%, #0f0520 40%, #000000 100%);
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 255, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 0, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(0, 150, 255, 0.06) 0%, transparent 50%);
      pointer-events: none;
      animation: ambientGlow 8s ease-in-out infinite alternate;
    }

    @keyframes ambientGlow {
      0% { opacity: 0.3; }
      100% { opacity: 0.7; }
    }
    
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at center, #1a0d2e 0%, #0f0520 40%, #000000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .neural-core {
      width: 200px;
      height: 200px;
      position: relative;
      margin-bottom: 3rem;
    }
    
    .core-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid;
      animation: coreRotation 4s linear infinite;
    }
    
    .ring-outer {
      width: 200px;
      height: 200px;
      border-color: rgba(0, 255, 255, 0.6);
      animation-duration: 8s;
    }
    
    .ring-middle {
      width: 150px;
      height: 150px;
      top: 25px;
      left: 25px;
      border-color: rgba(255, 0, 255, 0.4);
      animation-duration: 6s;
      animation-direction: reverse;
    }
    
    .ring-inner {
      width: 100px;
      height: 100px;
      top: 50px;
      left: 50px;
      border-color: rgba(0, 150, 255, 0.8);
      animation-duration: 4s;
    }
    
    .core-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.3), rgba(255, 0, 255, 0.2));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
      animation: centerPulse 2s ease-in-out infinite;
    }
    
    @keyframes coreRotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes centerPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 30px rgba(0, 255, 255, 0.5); }
      50% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 50px rgba(0, 255, 255, 0.8); }
    }
    
    .loading-sequence {
      text-align: center;
      max-width: 500px;
    }
    
    .loading-text {
      color: rgba(0, 255, 255, 0.8);
      font-size: 0.9rem;
      font-weight: 400;
      margin: 0.8rem 0;
      opacity: 0;
      transform: translateY(20px);
      animation: textSequence 0.8s ease-out forwards;
    }
    
    .hologram-bar {
      width: 400px;
      height: 4px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 2px;
      margin: 2rem auto;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 255, 255, 0.2);
    }
    
    .hologram-progress {
      height: 100%;
      background: linear-gradient(90deg, 
        rgba(0, 255, 255, 0.8) 0%, 
        rgba(0, 150, 255, 0.6) 50%, 
        rgba(255, 0, 255, 0.4) 100%);
      width: 0%;
      animation: holoProgress 5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
      position: relative;
    }
    
    .hologram-progress::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 20px;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8));
      animation: progressGlint 1s ease-in-out infinite;
    }
    
    @keyframes textSequence {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes holoProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    
    @keyframes progressGlint {
      0%, 100% { opacity: 0; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(10px); }
    }
    
    .particle-field {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: radial-gradient(circle, rgba(0, 255, 255, 0.8), transparent);
      border-radius: 50%;
      animation: particleFloat 8s linear infinite;
    }
    
    @keyframes particleFloat {
      0% { 
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { 
        transform: translateY(-10vh) translateX(50px);
        opacity: 0;
      }
    }
    
    .hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.95);
    }

    .circuit-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.1;
    }
    
    .circuit-line {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        rgba(0, 255, 255, 0.6) 20%, 
        rgba(0, 255, 255, 0.6) 80%, 
        transparent 100%);
      animation: circuitPulse 4s ease-in-out infinite;
    }
    
    @keyframes circuitPulse {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="particle-field">
      <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
      <div class="particle" style="left: 20%; animation-delay: 1s;"></div>
      <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
      <div class="particle" style="left: 40%; animation-delay: 0.5s;"></div>
      <div class="particle" style="left: 50%; animation-delay: 1.5s;"></div>
      <div class="particle" style="left: 60%; animation-delay: 2.5s;"></div>
      <div class="particle" style="left: 70%; animation-delay: 0.3s;"></div>
      <div class="particle" style="left: 80%; animation-delay: 1.8s;"></div>
      <div class="particle" style="left: 90%; animation-delay: 2.2s;"></div>
    </div>
    
    <div class="circuit-lines">
      <div class="circuit-line" style="top: 20%; width: 300px; left: 10%; animation-delay: 0s;"></div>
      <div class="circuit-line" style="top: 40%; width: 250px; right: 10%; animation-delay: 1s;"></div>
      <div class="circuit-line" style="top: 60%; width: 400px; left: 30%; animation-delay: 2s;"></div>
      <div class="circuit-line" style="top: 80%; width: 200px; right: 20%; animation-delay: 1.5s;"></div>
    </div>
    
    <div class="neural-core">
      <div class="core-ring ring-outer"></div>
      <div class="core-ring ring-middle"></div>
      <div class="core-ring ring-inner"></div>
      <div class="core-center">AO1</div>
    </div>
    
    <div class="loading-sequence">
      <div class="loading-text" style="animation-delay: 0.5s;">INITIALIZING HOLOGRAPHIC MATRIX</div>
      <div class="loading-text" style="animation-delay: 1s;">ESTABLISHING QUANTUM TUNNELS</div>
      <div class="loading-text" style="animation-delay: 1.5s;">SYNCING NEURAL PATHWAYS</div>
      <div class="loading-text" style="animation-delay: 2s;">CALIBRATING THREAT ALGORITHMS</div>
      <div class="loading-text" style="animation-delay: 2.5s;">ACTIVATING SECURITY PROTOCOLS</div>
      <div class="hologram-bar">
        <div class="hologram-progress"></div>
      </div>
      <div class="loading-text" style="animation-delay: 4s; color: rgba(255, 255, 255, 0.9); font-weight: 500;">HOLOGRAPHIC INTERFACE ONLINE</div>
    </div>
  </div>
  
  <div id="app"></div>
  
  <script>
    setTimeout(() => {
      document.getElementById('loading-screen').classList.add('hidden');
    }, 6000);
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
