<!-- ech/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/ao1-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AO1 Neural Intelligence - CSOC Visibility Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #000;
      color: #fff;
      overflow: hidden;
    }
    
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(ellipse at center, #001122 0%, #000000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 1s ease-out;
    }
    
    .neural-logo {
      width: 120px;
      height: 120px;
      border: 2px solid #00D4FF;
      border-radius: 50%;
      position: relative;
      margin-bottom: 2rem;
      animation: logoAssemble 3s ease-in-out;
    }
    
    .neural-logo::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border: 1px solid #FF0080;
      border-radius: 50%;
      animation: innerPulse 2s infinite;
    }
    
    .neural-logo::after {
      content: 'AO1';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-weight: 700;
      font-size: 1.2rem;
      text-shadow: 0 0 10px #00D4FF;
    }
    
    .loading-sequence {
      text-align: center;
      margin-top: 2rem;
    }
    
    .loading-text {
      color: #00D4FF;
      font-size: 0.9rem;
      margin: 0.5rem 0;
      opacity: 0;
      animation: textReveal 0.5s ease-out forwards;
    }
    
    .loading-bar {
      width: 300px;
      height: 2px;
      background: #001122;
      border-radius: 1px;
      margin: 1rem auto;
      overflow: hidden;
      position: relative;
    }
    
    .loading-progress {
      height: 100%;
      background: linear-gradient(90deg, #00D4FF, #FF0080);
      width: 0%;
      animation: progressBar 4s ease-out forwards;
      box-shadow: 0 0 10px #00D4FF;
    }
    
    .hexagon-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.03;
      background-image: 
        radial-gradient(circle at 25px 25px, #00D4FF 1px, transparent 1px),
        radial-gradient(circle at 75px 75px, #FF0080 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridShift 20s linear infinite;
    }
    
    @keyframes logoAssemble {
      0% { transform: scale(0) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.1) rotate(180deg); opacity: 0.8; }
      100% { transform: scale(1) rotate(360deg); opacity: 1; }
    }
    
    @keyframes innerPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.7; }
    }
    
    @keyframes textReveal {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes progressBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    
    @keyframes gridShift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }
    
    .hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="hexagon-grid"></div>
    <div class="neural-logo"></div>
    <div class="loading-sequence">
      <div class="loading-text" style="animation-delay: 0.5s;">INITIALIZING NEURAL NETWORKS...</div>
      <div class="loading-text" style="animation-delay: 1s;">ESTABLISHING SECURE PROTOCOLS...</div>
      <div class="loading-text" style="animation-delay: 1.5s;">VERIFYING DATABASE ENCRYPTION...</div>
      <div class="loading-text" style="animation-delay: 2s;">LOADING HOLOGRAPHIC INTERFACE...</div>
      <div class="loading-text" style="animation-delay: 2.5s;">ACTIVATING THREAT INTELLIGENCE...</div>
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
      <div class="loading-text" style="animation-delay: 3.5s; color: #fff;">SYSTEM READY - ACCESS GRANTED</div>
    </div>
  </div>
  
  <div id="app"></div>
  
  <script>
    setTimeout(() => {
      document.getElementById('loading-screen').classList.add('hidden');
    }, 4500);
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
